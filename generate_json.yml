name: Auto Generate Wallpapers & Config JSON

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate wallpapers.json with Ads & UI Config
        run: |
          python3 -c '
          import os, json

          ignore_dirs = {".git", ".github"}
          valid_ext = (".jpg", ".jpeg", ".png", ".webp")

          # আগের সেটিংস (Ads ও UI) থাকলে তা অক্ষুণ্ণ রাখবে
          existing_config = {}
          if os.path.exists("wallpapers.json"):
              try:
                  with open("wallpapers.json", "r", encoding="utf-8") as f:
                      existing_config = json.load(f)
              except Exception:
                  pass

          default_ads = {
              "ads_enabled": True,
              "show_banner_ad": True,
              "show_interstitial_ad": True,
              "show_rewarded_ad_on_download": False,
              "interstitial_click_interval": 3,
              "android_banner_id": "ca-app-pub-3940256099942544/6300978111",
              "android_interstitial_id": "ca-app-pub-3940256099942544/1033173712",
              "android_rewarded_id": "ca-app-pub-3940256099942544/5224354917"
          }

          default_ui = {
              "app_title": "4K Wallpapers",
              "primary_color": "#6C63FF",
              "show_top_slider": True,
              "show_categories_bar": True,
              "grid_columns": 2,
              "popup_banner": {
                  "show": False,
                  "title": "Special Update!",
                  "message": "New 4K wallpapers added today!",
                  "image_url": ""
              }
          }

          categories = []
          wallpapers = []
          wall_id = 1

          for folder in sorted(os.listdir(".")):
              if os.path.isdir(folder) and folder not in ignore_dirs:
                  files = [f for f in sorted(os.listdir(folder)) if f.lower().endswith(valid_ext)]
                  if files:
                      categories.append({
                          "id": folder.lower(),
                          "name": folder,
                          "count": len(files),
                          "cover": f"/{folder}/{files[0]}"
                      })
                      for file in files:
                          wallpapers.append({
                              "id": f"w_{wall_id}",
                              "title": os.path.splitext(file)[0].replace("_", " ").replace("-", " ").title(),
                              "category": folder,
                              "image_url": f"/{folder}/{file}",
                              "is_premium": False
                          })
                          wall_id += 1

          data = {
              "base_url": "https://4k-wallpapare.pages.dev",
              "total_wallpapers": len(wallpapers),
              "ads_config": existing_config.get("ads_config", default_ads),
              "ui_config": existing_config.get("ui_config", default_ui),
              "categories": categories,
              "wallpapers": wallpapers
          }

          with open("wallpapers.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          '

      - name: Commit and Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers.json
          git diff --staged --quiet || git commit -m "Auto updated wallpapers.json"
          git push
